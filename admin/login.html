<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login - Shekhawati Gaming Zone
    </title>


    <!-- Login CSS -->

    <link
        rel="stylesheet"
        href="/admin/login.css">

</head>


<body>


    <!-- =========================
         LOGIN CONTAINER
    ========================== -->

    <div class="login-container">


        <!-- =========================
             LOGIN CARD
        ========================== -->

        <div class="login-card">


            <h1>
                🎮 Shekhawati Gaming Zone
            </h1>


            <h2>
                Admin Login
            </h2>


            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form id="loginForm">


                <!-- Username -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>


                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>


                <!-- Login Message -->

                <div
                    id="loginMessage"
                    class="login-message">
                </div>


            </form>


        </div>

    </div>


    <!-- =========================
         LOGIN JAVASCRIPT
    ========================== -->

    <script src="/admin/login.js"></script>


</body>

</html>
